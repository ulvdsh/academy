<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Изнутри и снаружи</title>
<meta name="theme-color" content="#F1F2EC">
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
:root {
  /* Палитра: холодная «лабораторная» бумага, сливовые чернила, три курса — абрикос, роза, бирюза */
  --paper: #F1F2EC;
  --card: #FFFFFF;
  --ink: #26212C;
  --muted: #6B6573;
  --line: #E0DEE3;
  --plum: #4B2456;
  --nut: #E8833A; --nut-deep: #A9501A; --nut-soft: #FBE9DA; --nut-pale: #FFF5EC;
  --skin: #D1688A; --skin-deep: #9C3A5A; --skin-soft: #F8E2EA; --skin-pale: #FDF2F5;
  --body: #2C8A7E; --body-deep: #1C6157; --body-soft: #DCEFEA;
  --fat: #F6E1BA; --fat-dark: #E5B868;
  --water: #5B9BD5; --water-soft: #E0EDF8;
  --blood: #C43F5A;
  --good: #2E8B57; --bad: #C2453D;
  --on-acc: #FFFFFF;
  --display: 'Yeseva One', 'Georgia', serif;
  --text: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(38,33,44,.05), 0 8px 24px rgba(38,33,44,.06);
  /* Макет: одна колонка чтения 720px для уроков, сетка 3×1 для курсов на главной */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #151318; --card: #201D25; --ink: #EEEAF2; --muted: #A59FAD; --line: #35303C; --plum: #CDA6DA;
    --nut-deep: #F2A666; --nut-soft: #3A2A1D; --nut-pale: #2C2219;
    --skin-deep: #EE9AB5; --skin-soft: #3B2330; --skin-pale: #2C1E25;
    --body-deep: #6FCDBE; --body-soft: #1A3330;
    --fat: #4A3D27; --fat-dark: #8E6C34; --water-soft: #1C2A37;
    --on-acc: #17141B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #151318; --card: #201D25; --ink: #EEEAF2; --muted: #A59FAD; --line: #35303C; --plum: #CDA6DA;
  --nut-deep: #F2A666; --nut-soft: #3A2A1D; --nut-pale: #2C2219;
  --skin-deep: #EE9AB5; --skin-soft: #3B2330; --skin-pale: #2C1E25;
  --body-deep: #6FCDBE; --body-soft: #1A3330;
  --fat: #4A3D27; --fat-dark: #8E6C34; --water-soft: #1C2A37;
  --on-acc: #17141B;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
.c-nut { --acc: var(--nut); --acc-deep: var(--nut-deep); --acc-soft: var(--nut-soft); }
.c-skin { --acc: var(--skin); --acc-deep: var(--skin-deep); --acc-soft: var(--skin-soft); }
.c-body { --acc: var(--body); --acc-deep: var(--body-deep); --acc-soft: var(--body-soft); }
.c-none { --acc: var(--plum); --acc-deep: var(--plum); --acc-soft: var(--skin-pale); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--text); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: .005em; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--acc, var(--plum)); outline-offset: 2px; border-radius: 8px; }
svg text { font-family: var(--text); }

/* ---------- Шапка ---------- */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1140px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.logo-mark { width: 34px; height: 34px; flex: none; }
.logo b { font-family: var(--display); font-weight: 400; font-size: 21px; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; padding: 7px 12px; border-radius: 99px; font-size: 15px; font-weight: 500; color: var(--muted); }
.nav a:hover, .nav a.on { background: var(--card); color: var(--ink); }
.sync { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.cloud i { background: var(--good); }
.read-bar { position: fixed; left: 0; top: 0; height: 3px; background: var(--acc); z-index: 30; width: 0; transition: width .1s linear; }

main { max-width: 1140px; margin: 0 auto; padding: 28px 20px 80px; }

/* ---------- Общие элементы ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 99px; padding: 12px 22px; font-weight: 600; font-size: 16px; text-decoration: none; background: var(--acc-deep, var(--plum)); color: var(--on-acc); transition: transform .15s ease, box-shadow .15s ease; }
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 8px 16px; font-size: 14.5px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--acc-deep, var(--plum)); }
.muted { color: var(--muted); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--acc); border-radius: 99px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--line); color: var(--muted); white-space: nowrap; }
.pill.done { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.pill.go { background: var(--acc-soft); color: var(--acc-deep); }
.back { display: inline-flex; gap: 6px; font-size: 15px; color: var(--muted); text-decoration: none; margin-bottom: 18px; }
.back:hover { color: var(--ink); }

/* ---------- Главная ---------- */
.hero { display: grid; grid-template-columns: 1.35fr 1fr; gap: 28px; align-items: stretch; margin-bottom: 44px; }
.hero-text { padding: 22px 0; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
.hero h1 { font-size: clamp(40px, 6vw, 68px); }
.hero h1 em { font-style: normal; color: var(--skin-deep); }
.hero p.lead { font-size: 19px; color: var(--muted); max-width: 34ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.stat-card { background: var(--card); border-radius: 26px; padding: 26px; box-shadow: var(--shadow); display: grid; gap: 18px; align-content: center; }
.ring-row { display: flex; align-items: center; gap: 20px; }
.ring { width: 120px; height: 120px; flex: none; }
.ring-num { font-family: var(--display); font-size: 30px; }
.mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mini-stats div { background: var(--paper); border-radius: 14px; padding: 12px; }
.mini-stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.mini-stats span { font-size: 12.5px; color: var(--muted); line-height: 1.3; display: block; }
.course-bars { display: grid; gap: 10px; }
.course-bars .cb { display: grid; grid-template-columns: 120px 1fr 40px; gap: 10px; align-items: center; font-size: 14px; }
.course-bars .cb span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 18px; }
.section-title h2 { font-size: 30px; }
.courses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 52px; }
.course-card { background: var(--card); border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); text-decoration: none; display: flex; flex-direction: column; transition: transform .2s ease; }
.course-card:hover { transform: translateY(-3px); }
.course-card .cover svg { display: block; width: 100%; height: auto; }
.course-card .cc-body { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.course-card h3 { font-size: 26px; }
.course-card .sub { font-weight: 600; color: var(--acc-deep); font-size: 15px; }
.course-card p { font-size: 15px; color: var(--muted); flex: 1; }
.cc-meta { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); }

.how { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 40px; }
.how div { background: var(--card); border-radius: 18px; padding: 18px; border: 1px solid var(--line); }
.how b { font-family: var(--display); font-weight: 400; font-size: 32px; color: var(--plum); display: block; line-height: 1; margin-bottom: 8px; }
.how h4 { margin: 0 0 4px; font-size: 16px; }
.how p { font-size: 14px; color: var(--muted); line-height: 1.45; }

.foot { border-top: 1px solid var(--line); padding-top: 22px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); }
.linkbtn { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--muted); font-size: 14px; }

/* ---------- Страница курса ---------- */
.c-hero { background: var(--acc-soft); border-radius: 28px; display: grid; grid-template-columns: 1.3fr 1fr; overflow: hidden; margin-bottom: 34px; }
.c-hero-text { padding: 34px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.c-hero h1 { font-size: clamp(36px, 5vw, 56px); }
.c-hero p { color: var(--muted); max-width: 46ch; }
.c-hero .cover svg { width: 100%; height: 100%; display: block; object-fit: cover; }
.c-hero .cover { min-height: 220px; display: flex; }
.c-hero .bar { background: color-mix(in srgb, var(--card) 70%, transparent); max-width: 360px; }
.c-stats { display: flex; gap: 22px; flex-wrap: wrap; font-size: 14.5px; color: var(--muted); }
.c-stats b { color: var(--ink); font-size: 18px; }

.modules { display: grid; gap: 16px; }
.module { background: var(--card); border-radius: 22px; padding: 24px; box-shadow: var(--shadow); display: grid; grid-template-columns: 74px 1fr; gap: 6px 18px; }
.module.soon { box-shadow: none; background: transparent; border: 1.5px dashed var(--line); }
.m-num { font-family: var(--display); font-size: 46px; line-height: 1; color: var(--acc); grid-row: span 2; }
.module.soon .m-num { color: var(--line); }
.m-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.m-head h3 { font-size: 24px; }
.m-desc { font-size: 15px; color: var(--muted); }
.lessons { grid-column: 2; display: grid; gap: 6px; margin-top: 12px; }
.lrow { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; text-decoration: none; background: var(--paper); }
a.lrow:hover { background: var(--acc-soft); }
.lrow .st { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--card); border: 2px solid var(--line); color: var(--muted); }
.lrow.done .st { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.lrow.next .st { border-color: var(--acc); color: var(--acc-deep); }
.lrow.locked, .lrow.soonl { opacity: .55; }
.lrow .lt { font-weight: 500; font-size: 15.5px; line-height: 1.35; }
.lrow .lm { font-size: 13px; color: var(--muted); white-space: nowrap; }
.lrow.test .lt { font-weight: 700; }
.soon-list { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.soon-list span { font-size: 13.5px; padding: 5px 12px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }

/* ---------- Урок ---------- */
.lesson { max-width: 740px; margin: 0 auto; }
.l-head { margin-bottom: 26px; display: grid; gap: 12px; }
.l-head h1 { font-size: clamp(34px, 5vw, 50px); }
.l-lead { font-size: 19.5px; line-height: 1.55; color: var(--ink); opacity: .85; }
.content { display: grid; gap: 18px; }
.content > *, .lesson > * { min-width: 0; }
.content h2 { font-size: 30px; margin-top: 22px; }
.content p { max-width: 68ch; }
.content b { font-weight: 650; }
.callout { border-radius: 18px; padding: 18px 20px; display: grid; gap: 6px; }
.callout.key { background: var(--acc-soft); border-left: 5px solid var(--acc); }
.callout.fact { background: var(--card); border: 1.5px solid var(--line); }
.callout-label { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--acc-deep); }
.callout.fact .callout-label { color: var(--plum); }
.callout.key p { font-size: 18px; font-weight: 500; }
.myth { display: grid; grid-template-columns: 1fr 1.4fr; border-radius: 18px; overflow: hidden; border: 1.5px solid var(--line); background: var(--card); }
.myth > div { padding: 16px 18px; display: grid; gap: 6px; align-content: start; }
.myth .m { background: var(--paper); }
.myth .m p { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 55%, transparent); text-decoration-thickness: 2px; }
.tag { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.myth .m .tag { color: var(--bad); }
.myth .t .tag { color: var(--good); }
.art { margin: 6px 0; background: var(--card); border-radius: 20px; padding: 18px; border: 1px solid var(--line); }
.art svg { width: 100%; height: auto; display: block; }
.art figcaption { font-size: 14px; color: var(--muted); margin-top: 10px; text-align: center; }
.art-scroll { overflow-x: auto; }
.art-scroll svg { min-width: 520px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.card { background: var(--card); border-radius: 16px; padding: 16px; border: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.card h4 { margin: 0; font-size: 16px; line-height: 1.3; display: flex; gap: 8px; align-items: baseline; }
.card h4::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--acc); flex: none; transform: translateY(-1px); }
.card p { font-size: 15px; color: var(--muted); line-height: 1.5; }
.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; display: grid; gap: 4px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 14px; position: relative; padding-bottom: 14px; }
.steps li::before { content: counter(s); width: 36px; height: 36px; border-radius: 50%; background: var(--acc-soft); color: var(--acc-deep); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 17px; top: 40px; bottom: 0; width: 2px; background: var(--acc-soft); }
.steps b { display: block; font-size: 16.5px; margin-top: 5px; }
.steps p { font-size: 15.5px; color: var(--muted); }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.list li { position: relative; padding-left: 24px; }
.list li::before { content: ""; position: absolute; left: 4px; top: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.compare > div { border-radius: 18px; padding: 18px; background: var(--card); border: 1px solid var(--line); }
.compare > div:last-child { background: var(--acc-soft); border-color: transparent; }
.compare h4 { margin: 0 0 10px; font-size: 17px; }
.compare ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 15px; }
.table-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--line); background: var(--card); }
table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 460px; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--paper); }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 600; }

.summary { margin-top: 36px; background: var(--ink); color: var(--paper); border-radius: 24px; padding: 26px; display: grid; gap: 14px; }
.summary h2 { font-size: 26px; color: var(--paper); margin: 0; }
.summary ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.summary li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 16px; }
.summary li::before { content: "✓"; width: 24px; height: 24px; border-radius: 50%; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; font-size: 13px; font-weight: 700; margin-top: 2px; }

.task { margin-top: 22px; border-radius: 24px; padding: 24px; border: 2px dashed var(--acc); background: var(--card); display: grid; gap: 12px; }
.task h3 { font-size: 24px; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 15.5px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--acc-deep); }
.notes { width: 100%; min-height: 110px; resize: vertical; border-radius: 14px; border: 1.5px solid var(--line); background: var(--paper); padding: 12px 14px; font: inherit; font-size: 15.5px; color: var(--ink); }
.notes:focus { outline: none; border-color: var(--acc); }
.saved-note { font-size: 13px; color: var(--muted); min-height: 18px; }

/* ---------- Тест ---------- */
.quiz { margin-top: 22px; background: var(--card); border-radius: 24px; padding: 26px; box-shadow: var(--shadow); display: grid; gap: 16px; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.quiz-top h2 { font-size: 26px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 22px; height: 6px; border-radius: 99px; background: var(--line); }
.dots i.ok { background: var(--good); }
.dots i.no { background: var(--bad); }
.dots i.cur { background: var(--acc); }
.q-text { font-size: 19px; font-weight: 600; line-height: 1.4; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--paper); border-radius: 14px; padding: 13px 16px; font-size: 16px; line-height: 1.4; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; transition: border-color .15s, background .15s; }
.opt:hover:not([disabled]) { border-color: var(--acc); background: var(--acc-soft); }
.opt .letter { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--card); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--card)); }
.opt.right .letter { background: var(--good); border-color: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--card)); }
.opt.wrong .letter { background: var(--bad); border-color: var(--bad); color: #fff; }
.explain { border-radius: 14px; padding: 14px 16px; background: var(--paper); font-size: 15.5px; display: grid; gap: 4px; }
.explain b { font-size: 16px; }
.explain.ok b { color: var(--good); }
.explain.no b { color: var(--bad); }
.result { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 10px 0; position: relative; }
.result .big { font-family: var(--display); font-size: 64px; line-height: 1; color: var(--acc-deep); }
.result p { max-width: 46ch; color: var(--muted); }
.result .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.burst { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.burst i { position: absolute; left: 50%; top: 40px; width: 9px; height: 9px; border-radius: 3px; opacity: 0; animation: burst 1s ease-out forwards; }
@keyframes burst { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(260deg); } }

.l-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
.locked-box { max-width: 560px; margin: 40px auto; text-align: center; background: var(--card); border-radius: 24px; padding: 34px; box-shadow: var(--shadow); display: grid; gap: 14px; justify-items: center; }
.locked-box h1 { font-size: 32px; }

/* ---------- Словарь ---------- */
.gl-head { display: grid; gap: 12px; margin-bottom: 22px; max-width: 740px; }
.gl-head h1 { font-size: clamp(36px, 5vw, 52px); }
.search { width: 100%; max-width: 420px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--card); padding: 12px 18px; font: inherit; color: var(--ink); }
.search:focus { outline: none; border-color: var(--plum); }
.gl { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.term { background: var(--card); border-radius: 16px; padding: 16px 18px; border: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.term h3 { font-family: var(--text); font-weight: 700; font-size: 17px; }
.term p { font-size: 15px; color: var(--muted); line-height: 1.5; }
.term a { font-size: 13.5px; font-weight: 600; color: var(--acc-deep); text-decoration: none; }

/* ---------- Диалог ---------- */
.dlg-bg { position: fixed; inset: 0; background: rgba(20,16,24,.45); display: grid; place-items: center; z-index: 50; padding: 20px; }
.dlg { background: var(--card); border-radius: 22px; padding: 26px; max-width: 420px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.dlg h3 { font-size: 24px; }
.dlg .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.btn.danger { background: var(--bad); color: #fff; }

@media (max-width: 900px) {
  .hero, .c-hero { grid-template-columns: 1fr; }
  .courses { grid-template-columns: 1fr; }
  .how { grid-template-columns: 1fr 1fr; }
  .c-hero .cover { min-height: 0; order: -1; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  main { padding: 20px 16px 70px; }
  .top-in { padding: 10px 16px; gap: 10px; }
  .logo b { font-size: 18px; }
  .sync span { display: none; }
  .nav a { padding: 6px 9px; font-size: 14px; }
  .how { grid-template-columns: 1fr; }
  .module { grid-template-columns: 1fr; padding: 20px; }
  .m-num { grid-row: auto; font-size: 34px; }
  .lessons, .soon-list { grid-column: 1; }
  .myth, .compare { grid-template-columns: 1fr; }
  .c-hero-text { padding: 24px; }
  .quiz, .task, .summary { padding: 20px; }
  .lrow { grid-template-columns: 30px 1fr; }
  .lrow .lm { grid-column: 2; }
  .mini-stats b { font-size: 19px; }
  .course-bars .cb { grid-template-columns: 96px 1fr 36px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body class="c-none">
<div class="read-bar" id="readBar"></div>
<header class="top">
  <div class="top-in">
    <a class="logo" href="#home" aria-label="Изнутри и снаружи, на главную">
      <svg class="logo-mark" viewBox="0 0 34 34" aria-hidden="true"><circle cx="12" cy="13" r="9" fill="var(--nut)"/><circle cx="22" cy="13" r="9" fill="var(--skin)" opacity=".85"/><circle cx="17" cy="22" r="9" fill="var(--body)" opacity=".85"/></svg>
      <b>Изнутри и снаружи</b>
    </a>
    <nav class="nav">
      <a href="#home" id="navHome">Курсы</a>
      <a href="#glossary" id="navGl">Словарь</a>
    </nav>
    <div class="sync" id="sync" title="Где хранится прогресс"><i></i><span>на этом устройстве</span></div>
  </div>
</header>
<main id="app"></main>

<script>
/* Иллюстрации платформы: SVG, цвета берутся из CSS-переменных темы */
window.ART = (function () {
  const T = 'font-family="inherit"';
  const ink = 'var(--ink)', muted = 'var(--muted)';

  function txt(x, y, s, o = {}) {
    const size = o.size || 14, w = o.w || 400, fill = o.fill || ink, anchor = o.anchor || 'start';
    return `<text x="${x}" y="${y}" ${T} font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="${anchor}">${s}</text>`;
  }

  const A = {};

  /* ---------- Обложки курсов ---------- */
  A.coverNutrition = () => `
  <svg viewBox="0 0 320 200" role="img" aria-label="Долька цитруса и листья">
    <rect width="320" height="200" fill="var(--nut-soft)"/>
    <circle cx="250" cy="40" r="70" fill="var(--nut)" opacity=".18"/>
    <g transform="translate(160 108)">
      <circle r="72" fill="var(--nut)"/>
      <circle r="62" fill="var(--nut-pale)"/>
      ${Array.from({ length: 10 }, (_, i) => {
        const a1 = (i * 36 + 4) * Math.PI / 180, a2 = ((i + 1) * 36 - 4) * Math.PI / 180;
        const r = 56, ri = 8;
        return `<path d="M${(ri * Math.cos((a1 + a2) / 2)).toFixed(1)} ${(ri * Math.sin((a1 + a2) / 2)).toFixed(1)} L${(r * Math.cos(a1)).toFixed(1)} ${(r * Math.sin(a1)).toFixed(1)} A${r} ${r} 0 0 1 ${(r * Math.cos(a2)).toFixed(1)} ${(r * Math.sin(a2)).toFixed(1)} Z" fill="var(--nut)" opacity=".55"/>`;
      }).join('')}
      <circle r="7" fill="var(--nut-pale)"/>
    </g>
    <path d="M60 170 C40 120 70 80 120 70 C120 120 100 155 60 170 Z" fill="var(--body)" opacity=".75"/>
    <path d="M60 170 C80 130 95 105 118 74" stroke="var(--paper)" stroke-width="2" fill="none" opacity=".7"/>
    <circle cx="262" cy="160" r="9" fill="var(--skin)" opacity=".8"/>
    <circle cx="282" cy="140" r="5" fill="var(--skin)" opacity=".6"/>
  </svg>`;

  A.coverSkin = () => `
  <svg viewBox="0 0 320 200" role="img" aria-label="Слои кожи">
    <rect width="320" height="200" fill="var(--skin-soft)"/>
    <path d="M0 70 C60 50 100 90 160 70 S260 50 320 70 V200 H0 Z" fill="var(--skin)" opacity=".9"/>
    <path d="M0 95 C60 80 110 115 170 95 S270 80 320 95 V200 H0 Z" fill="var(--skin-pale)"/>
    <path d="M0 150 C70 140 120 165 180 150 S280 140 320 150 V200 H0 Z" fill="var(--fat)"/>
    ${[30, 75, 120, 165, 210, 255, 300].map((x, i) => `<circle cx="${x}" cy="${172 + (i % 2) * 10}" r="13" fill="var(--fat-dark)" opacity=".45"/>`).join('')}
    ${[50, 110, 190, 240, 290].map((x, i) => `<path d="M${x - 18} ${120 + (i % 2) * 6} q9 -10 18 0 t18 0" stroke="var(--skin)" stroke-width="3" fill="none" opacity=".6"/>`).join('')}
    <path d="M240 18 C240 18 222 40 222 52 a18 18 0 0 0 36 0 C258 40 240 18 240 18 Z" fill="var(--water)" opacity=".85"/>
  </svg>`;

  A.coverBody = () => `
  <svg viewBox="0 0 320 200" role="img" aria-label="Гантель и линии движения">
    <rect width="320" height="200" fill="var(--body-soft)"/>
    ${[110, 85, 60].map((r, i) => `<circle cx="160" cy="210" r="${r + 60}" fill="none" stroke="var(--body)" stroke-width="${10 - i * 3}" opacity="${0.25 + i * 0.15}"/>`).join('')}
    <g transform="translate(160 92) rotate(-18)">
      <rect x="-70" y="-6" width="140" height="12" rx="6" fill="var(--ink)" opacity=".85"/>
      <rect x="-92" y="-32" width="22" height="64" rx="7" fill="var(--body)"/>
      <rect x="-112" y="-24" width="18" height="48" rx="6" fill="var(--body)" opacity=".75"/>
      <rect x="70" y="-32" width="22" height="64" rx="7" fill="var(--body)"/>
      <rect x="94" y="-24" width="18" height="48" rx="6" fill="var(--body)" opacity=".75"/>
    </g>
    <circle cx="60" cy="40" r="8" fill="var(--nut)"/>
    <circle cx="275" cy="160" r="12" fill="var(--skin)" opacity=".8"/>
  </svg>`;

  /* ---------- Нутрициология ---------- */
  A.pyramid = () => {
    const tiers = [
      [20, 88, 0, 32, 1, 'Мета-анализы и обзоры', 'свод многих исследований'],
      [88, 156, 32, 64, .8, 'РКИ', 'случайные группы + контроль'],
      [156, 224, 64, 96, .6, 'Наблюдательные', 'связи в больших группах людей'],
      [224, 292, 96, 128, .42, 'Клетки и животные', 'механизм, но не человек'],
      [292, 360, 128, 160, .24, 'Мнения и отзывы', 'личный опыт, «мне помогло»'],
    ];
    const cx = 210;
    return `<svg viewBox="0 0 640 380" role="img" aria-label="Пирамида доказательств">
      <defs><marker id="arUp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${muted}"/></marker></defs>
      <line x1="30" y1="350" x2="30" y2="40" stroke="${muted}" stroke-width="2" marker-end="url(#arUp)"/>
      <text x="22" y="200" ${T} font-size="13" fill="${muted}" transform="rotate(-90 22 200)" text-anchor="middle">надёжность растёт</text>
      ${tiers.map(([y1, y2, h1, h2, op, t, s]) => {
        const ym = (y1 + y2) / 2, hm = (h1 + h2) / 2;
        return `<polygon points="${cx - h1},${y1} ${cx + h1},${y1} ${cx + h2},${y2} ${cx - h2},${y2}" fill="var(--nut)" fill-opacity="${op}" stroke="var(--card)" stroke-width="3"/>
        <line x1="${cx + hm + 6}" y1="${ym}" x2="392" y2="${ym}" stroke="var(--line)" stroke-width="1.5"/>
        ${txt(400, ym - 3, t, { size: 15, w: 600 })}${txt(400, ym + 15, s, { size: 12.5, fill: muted })}`;
      }).join('')}
    </svg>`;
  };

  A.digestion = () => {
    const st = [
      [80, 'Рот', 'жуём, амилаза слюны'],
      [250, 'Желудок', 'кислота и пепсин · 2–4 ч'],
      [420, 'Тонкий кишечник', 'всасывание · 3–6 ч'],
      [590, 'Толстый кишечник', 'вода и бактерии · 1–2 сут'],
    ];
    return `<svg viewBox="0 0 680 270" role="img" aria-label="Путь еды по пищеварительной системе">
      <path d="M80 170 C150 110 180 230 250 170 S350 110 420 170 S520 230 590 170" stroke="var(--nut)" stroke-width="10" fill="none" stroke-linecap="round" opacity=".35"/>
      <path d="M420 132 C440 90 470 70 506 60" stroke="var(--skin)" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
      <circle cx="540" cy="52" r="30" fill="var(--skin)" opacity=".85"/>
      ${txt(540, 57, 'печень', { size: 12.5, w: 600, fill: 'var(--on-acc)', anchor: 'middle' })}
      ${txt(470, 40, 'в кровь →', { size: 12, fill: muted, anchor: 'end' })}
      ${st.map(([x, t, s], i) => `
        <circle cx="${x}" cy="170" r="36" fill="var(--card)" stroke="var(--nut)" stroke-width="4"/>
        ${txt(x, 179, String(i + 1), { size: 26, w: 700, fill: 'var(--nut-deep)', anchor: 'middle' })}
        ${txt(x, 230, t, { size: 14.5, w: 600, anchor: 'middle' })}
        ${txt(x, 250, s, { size: 12, fill: muted, anchor: 'middle' })}`).join('')}
    </svg>`;
  };

  A.kcal = () => {
    const rows = [['Белки', 4, .65], ['Углеводы', 4, .65], ['Алкоголь', 7, .35], ['Жиры', 9, 1]];
    return `<svg viewBox="0 0 620 230" role="img" aria-label="Калорийность одного грамма">
      ${rows.map(([n, v, op], i) => {
        const y = 22 + i * 50, w = v / 9 * 400;
        return `${txt(118, y + 21, n, { size: 15, w: 600, anchor: 'end' })}
        <rect x="132" y="${y}" width="${w}" height="30" rx="8" fill="var(--nut)" fill-opacity="${op}"/>
        ${txt(140 + w, y + 21, v + ' ккал / г', { size: 14, w: 600 })}`;
      }).join('')}
    </svg>`;
  };

  A.energy = () => {
    const seg = [[0, 390, 'Основной обмен', '60–70%: органы, мозг, клетки', 1], [390, 60, 'Пищеварение', '≈10%', .55], [450, 150, 'Движение', '20–30%: спорт + быт', .3]];
    return `<svg viewBox="0 0 640 180" role="img" aria-label="Из чего складывается суточный расход энергии">
      ${seg.map(([x, w, t, s, op], i) => `
        <rect x="${20 + x}" y="30" width="${w - 3}" height="56" rx="10" fill="var(--nut)" fill-opacity="${op}"/>
        ${txt(20 + x + 8, 122 + (i === 1 ? 26 : 0), t, { size: 14.5, w: 600 })}
        ${txt(20 + x + 8, 141 + (i === 1 ? 26 : 0), s, { size: 12, fill: muted })}`).join('')}
      <line x1="${20 + 390 + 28}" y1="88" x2="${20 + 390 + 28}" y2="128" stroke="var(--line)" stroke-width="1.5"/>
    </svg>`;
  };

  A.atp = () => `
  <svg viewBox="0 0 660 300" role="img" aria-label="Как клетка получает энергию">
    <defs><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="${muted}"/></marker></defs>
    <rect x="160" y="24" width="340" height="252" rx="110" fill="var(--nut-soft)" stroke="var(--nut)" stroke-width="2" stroke-dasharray="4 6"/>
    ${txt(330, 50, 'клетка', { size: 12, fill: muted, anchor: 'middle' })}
    <ellipse cx="330" cy="150" rx="120" ry="62" fill="var(--skin)" opacity=".9"/>
    <ellipse cx="330" cy="150" rx="104" ry="48" fill="var(--skin-pale)"/>
    <path d="M240 150 q12 -38 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0" stroke="var(--skin)" stroke-width="5" fill="none" stroke-linejoin="round"/>
    ${txt(330, 236, 'митохондрия', { size: 14, w: 600, anchor: 'middle' })}
    ${[['глюкоза', 82], ['жирные кислоты', 132], ['кислород O₂', 182]].map(([t, y]) => `${txt(12, y + 4, t, { size: 13.5, w: 600 })}<line x1="${t === 'жирные кислоты' ? 130 : 100}" y1="${y}" x2="212" y2="${y + (150 - y) * .45}" stroke="${muted}" stroke-width="2" marker-end="url(#arR)"/>`).join('')}
    <line x1="452" y1="130" x2="540" y2="104" stroke="${muted}" stroke-width="2" marker-end="url(#arR)"/>
    <line x1="452" y1="178" x2="540" y2="212" stroke="${muted}" stroke-width="2" marker-end="url(#arR)"/>
    <g transform="translate(548 80)">
      ${[0, 1, 2].map(i => `<rect x="${i * 34}" y="0" width="28" height="44" rx="5" fill="var(--nut)"/><rect x="${i * 34 + 9}" y="-5" width="10" height="6" rx="2" fill="var(--nut)"/>`).join('')}
    </g>
    ${txt(598, 146, 'АТФ', { size: 16, w: 700, fill: 'var(--nut-deep)', anchor: 'middle' })}
    ${txt(596, 236, 'CO₂ и вода', { size: 13, fill: muted, anchor: 'middle' })}
  </svg>`;

  /* ---------- Косметология ---------- */
  A.skinLayers = () => `
  <svg viewBox="0 0 660 370" role="img" aria-label="Строение кожи в разрезе">
    <rect x="20" y="66" width="420" height="168" fill="var(--skin-pale)"/>
    <rect x="20" y="232" width="420" height="118" fill="var(--fat)"/>
    ${Array.from({ length: 18 }, (_, i) => { const x = 40 + (i % 6) * 68 + (Math.floor(i / 6) % 2) * 30, y = 254 + Math.floor(i / 6) * 34; return `<circle cx="${x}" cy="${y}" r="16" fill="var(--fat-dark)" opacity=".38"/>`; }).join('')}
    ${[100, 130, 160, 190].map((y, i) => `<path d="M${30 + i * 8} ${y} q14 -10 28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0" stroke="var(--skin)" stroke-width="2" fill="none" opacity=".45"/>`).join('')}
    <path d="M20 214 C80 200 120 226 180 212 S300 198 360 214 S420 220 440 210" stroke="var(--blood)" stroke-width="4" fill="none" opacity=".75"/>
    <path d="M20 40 H440 V66 C400 76 380 60 340 70 C300 80 280 62 240 72 C200 82 180 64 140 72 C100 80 70 64 20 70 Z" fill="var(--skin)"/>
    <path d="M118 8 L132 200" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M112 66 C108 120 112 180 122 206 C130 214 144 212 146 200 C146 160 136 110 132 66" fill="none" stroke="var(--skin)" stroke-width="2.5"/>
    <ellipse cx="133" cy="207" rx="13" ry="10" fill="var(--skin)"/>
    <ellipse cx="160" cy="124" rx="18" ry="13" fill="var(--nut)" opacity=".8"/>
    <path d="M330 40 V200" stroke="var(--water)" stroke-width="2.5"/>
    <path d="M330 200 c-18 0 -18 18 0 18 s18 18 0 18 s-18 18 0 18 s18 -10 4 -16" stroke="var(--water)" stroke-width="5" fill="none" stroke-linecap="round"/>
    ${txt(186, 128, 'сальная железа', { size: 11.5, fill: muted })}
    ${txt(150, 26, 'волос', { size: 11.5, fill: muted })}
    ${txt(350, 128, 'потовая', { size: 11.5, fill: muted })}${txt(350, 142, 'железа', { size: 11.5, fill: muted })}
    ${txt(240, 228, 'сосуды', { size: 11.5, fill: muted })}
    ${[[55, 'Эпидермис', 'барьер · 0,05–1,5 мм'], [150, 'Дерма', 'коллаген, эластин,'], [290, 'Гиподерма', 'жировая ткань']].map(([y, t, s]) => `<line x1="444" y1="${y}" x2="466" y2="${y}" stroke="var(--line)" stroke-width="1.5"/>${txt(474, y - 2, t, { size: 16, w: 700 })}${txt(474, y + 17, s, { size: 12.5, fill: muted })}`).join('')}
    ${txt(474, 186, 'гиалуроновая кислота · 1–4 мм', { size: 12.5, fill: muted })}
  </svg>`;

  A.barrier = () => {
    function wall(ox, damaged) {
      let s = `<rect x="${ox}" y="70" width="280" height="170" rx="14" fill="${damaged ? 'var(--paper)' : 'var(--fat)'}" ${damaged ? 'stroke="var(--line)"' : ''}/>`;
      if (damaged) s += `<rect x="${ox}" y="70" width="280" height="170" rx="14" fill="var(--fat)" opacity=".35"/>`;
      const miss = new Set(['1-2', '2-0', '3-3', '0-3', '4-1', '2-3']);
      for (let r = 0; r < 5; r++) for (let c = 0; c < 4; c++) {
        if (damaged && miss.has(r + '-' + c)) continue;
        const x = ox + 14 + c * 64 + (r % 2 ? 22 : 0) - (r % 2 && c === 3 ? 400 : 0);
        if (x > ox + 250 || x < ox) continue;
        s += `<rect x="${x}" y="${82 + r * 31}" width="54" height="22" rx="6" fill="var(--card)" stroke="var(--skin)" stroke-width="2"/>`;
      }
      return s;
    }
    const drops = [[420, 56], [490, 50], [560, 56]].map(([x, y]) => `<path d="M${x} ${y - 14} C${x} ${y - 14} ${x - 9} ${y - 3} ${x - 9} ${y + 3} a9 9 0 0 0 18 0 C${x + 9} ${y - 3} ${x} ${y - 14} ${x} ${y - 14} Z" fill="var(--water)"/>`).join('');
    return `<svg viewBox="0 0 640 300" role="img" aria-label="Кожный барьер: кирпичи и раствор">
      ${txt(150, 24, 'Здоровый барьер', { size: 15, w: 700, anchor: 'middle' })}
      ${txt(490, 24, 'Повреждённый барьер', { size: 15, w: 700, anchor: 'middle' })}
      ${wall(10, false)}${wall(350, true)}${drops}
      ${txt(150, 268, 'корнеоциты = кирпичи', { size: 12.5, fill: muted, anchor: 'middle' })}
      ${txt(150, 286, 'липиды = раствор между ними', { size: 12.5, fill: muted, anchor: 'middle' })}
      ${txt(490, 268, 'вода уходит, раздражители', { size: 12.5, fill: muted, anchor: 'middle' })}
      ${txt(490, 286, 'проникают внутрь', { size: 12.5, fill: muted, anchor: 'middle' })}
    </svg>`;
  };

  A.renewal = () => {
    const layers = [
      ['Роговой слой', 'плоские «чешуйки» отшелушиваются', 'flat'],
      ['Зернистый', 'клетки уплощаются, делают липиды', 'mid'],
      ['Шиповатый', 'клетки крепко сцеплены', 'round'],
      ['Базальный', 'здесь рождаются новые клетки', 'base'],
    ];
    let s = '';
    layers.forEach(([t, d, k], i) => {
      const y = 40 + i * 62;
      for (let c = 0; c < 7; c++) {
        const x = 60 + c * 50 + (i % 2 ? 22 : 0);
        if (x > 400) continue;
        if (k === 'flat') s += `<rect x="${x - 22}" y="${y + 18 + (c % 2) * 3}" width="44" height="9" rx="4" fill="var(--skin)" opacity=".35" transform="rotate(${c % 3 === 0 ? -6 : 0} ${x} ${y + 22})"/>`;
        else if (k === 'mid') s += `<ellipse cx="${x}" cy="${y + 24}" rx="21" ry="11" fill="var(--skin)" opacity=".55"/>`;
        else if (k === 'round') s += `<ellipse cx="${x}" cy="${y + 24}" rx="19" ry="17" fill="var(--skin)" opacity=".75"/>`;
        else s += `<circle cx="${x}" cy="${y + 24}" r="17" fill="var(--skin)"/><circle cx="${x}" cy="${y + 24}" r="6" fill="var(--skin-pale)"/>`;
      }
      s += `${txt(452, y + 20, t, { size: 15, w: 700 })}${txt(452, y + 38, d, { size: 12.5, fill: muted })}`;
    });
    s += `<defs><marker id="arU2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--skin)"/></marker></defs>
      <line x1="30" y1="262" x2="30" y2="44" stroke="var(--skin)" stroke-width="3" marker-end="url(#arU2)"/>
      <text x="10" y="154" ${T} font-size="12" fill="${muted}" transform="rotate(-90 10 154)" text-anchor="middle">≈ 4 недели у молодой кожи</text>`;
    return `<svg viewBox="0 0 680 300" role="img" aria-label="Обновление эпидермиса">${s}</svg>`;
  };

  A.typeMap = () => `

  /* ---------- Вспомогательное ---------- */
  function smooth(pts) {
    let d = `M${pts[0][0]} ${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`;
    }
    return d;
  }
  function arc(cx, cy, r, a0, a1) {
    const rad = a => (a - 90) * Math.PI / 180;
    const x0 = cx + r * Math.cos(rad(a0)), y0 = cy + r * Math.sin(rad(a0)), x1 = cx + r * Math.cos(rad(a1)), y1 = cy + r * Math.sin(rad(a1));
    return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }

        { p: 'С этими симптомами идут к гинекологу или специалисту по реабилитации тазового дна (физиотерапевту).' },

        { steps: [
          { t: 'Почувствовать мышцы', d: 'Представь, что пытаешься остановить мочеиспускание и сдержать газы одновременно (только для понимания, не делай это при мочеиспускании регулярно).' },
          { t: 'Сокращение и расслабление', d: 'Сократи на 3–5 секунд, затем полностью расслабь на столько же. 10 повторений, 2–3 раза в день. Расслабление так же важно, как сокращение.' },
          { t: 'Без помощи пресса и ягодиц', d: 'Живот, ягодицы и бёдра расслаблены, дыхание свободное.' },

        { key: 'Если есть симптомы, лучше начать с консультации специалиста: иногда тазовое дно не слабое, а наоборот, слишком напряжённое, и ему нужны расслабление, а не тренировки.' },
        { myth: 'Чтобы был сильный кор, нужно делать много скручиваний.', truth: 'Скручивания тренируют лишь одну мышцу. Для функционального кора полезнее планки, «мёртвый жук», перенос тяжестей, базовые упражнения с правильным дыханием.' }
      ],
      summary: [
        'Кор — диафрагма, тазовое дно, глубокие мышцы живота и спины.',

      ],
      task: { title: 'Знакомство с кором', text: 'Попробуй упражнение для тазового дна из урока лёжа: 10 повторений сокращения и расслабления. Затем сделай «мёртвого жука» 2 × 8 на сторону, следя за дыханием. Запиши, что было сложнее: почувствовать мышцы или удержать поясницу.' },
      quiz: [
        { q: 'Из чего состоит кор?', o: ['Только из пресса', 'Диафрагма, тазовое дно, глубокие мышцы живота и спины', 'Только из спины', 'Из ягодиц'], a: 1, e: 'Это «цилиндр» вокруг позвоночника.' },
        { q: 'Подтекание мочи при прыжках — это…', o: ['Норма для всех', 'Частое, но не нормальное явление, с ним работают специалисты', 'Признак хорошей формы', 'Только у пожилых'], a: 1, e: 'Стоит обратиться к гинекологу или реабилитологу.' },
        { q: 'Что важно в упражнениях на тазовое дно?', o: ['Только сжимать изо всех сил', 'Сокращение и полное расслабление без помощи пресса и ягодиц', 'Задерживать дыхание', 'Делать 1000 раз'], a: 1, e: 'Расслабление так же важно.' },
        { q: 'Что полезнее для функционального кора?', o: ['Только скручивания', 'Планки, «мёртвый жук», перенос тяжестей с дыханием', 'Ничего', 'Только растяжка'], a: 1, e: 'Кор работает как система.' }

    }
  ],
  test: [
    { q: 'За 3 дня до месячных тяжело тренироваться, хочется сладкого. Что разумно?', o: ['Заставлять себя ставить рекорды', 'Снизить интенсивность по самочувствию, есть регулярно с белком', 'Голодать', 'Бросить тренировки'], a: 1, e: 'Подстраиваться по самочувствию.' },
    { q: 'Какой показатель говорит, что телу хватает энергии?', o: ['Регулярный цикл', 'Постоянный холод', 'Выпадение волос', 'Падение силы'], a: 0, e: 'Цикл — важный маркер.' },
    { q: 'Что из этого кор?', o: ['Бицепс', 'Тазовое дно', 'Икры', 'Шея'], a: 1, e: 'Это «дно» цилиндра.' },
    { q: 'При прыжках подтекает моча. Что делать?', o: ['Прыгать больше', 'Обратиться к гинекологу или специалисту по тазовому дну', 'Делать только скручивания', 'Игнорировать'], a: 1, e: 'С этим эффективно работают.' },
    { q: 'Почему пропадание месячных опасно для костей?', o: ['Это не опасно', 'Низкий эстроген и дефицит энергии снижают плотность костей', 'Из-за кальция в воде', 'Из-за витамина C'], a: 1, e: 'Это один из компонентов RED-S.' }
  ]
};

window.GLOSSARY = (window.GLOSSARY || []).concat([
  ['Гипертрофия', 'Увеличение объёма мышечных волокон в ответ на нагрузку.', 'b2-1'],
  ['Крепатура', 'Отсроченная мышечная боль через 24–72 часа после непривычной нагрузки.', 'b2-1'],
  ['Прогрессивная перегрузка', 'Постепенное увеличение нагрузки для продолжения прогресса.', 'b2-3'],
  ['Повторы в запасе', 'Сколько ещё повторений можно сделать в конце подхода.', 'b2-3'],
  ['Пульсовые зоны', 'Диапазоны интенсивности в процентах от максимального пульса.', 'b3-1'],
  ['HIIT', 'Высокоинтенсивные интервальные тренировки.', 'b3-3'],
  ['REM-сон', 'Фаза сна со сновидениями, важная для памяти и эмоций.', 'b4-1'],
  ['Мобильность', 'Способность активно двигаться в суставе в полной амплитуде.', 'b5-2'],
  ['Рекомпозиция', 'Одновременное снижение жира и рост мышц.', 'b6-3'],
  ['RED-S', 'Относительный дефицит энергии в спорте: нехватка еды при больших нагрузках.', 'b7-1'],
  ['Тазовое дно', 'Мышцы на дне таза, поддерживающие органы и контролирующие удержание мочи.', 'b7-2'],
  ['Кор', 'Мышечный «цилиндр»: диафрагма, тазовое дно, глубокие мышцы живота и спины.', 'b7-2']
]);

</script>
<script>
(function () {
  'use strict';
  const COURSES = window.COURSES || [];
  const MODS = window.MODULES || {};
  COURSES.forEach(c => c.modules.forEach(m => { const x = MODS[m.id]; if (x && x.lessons) { m.lessons = x.lessons; m.test = x.test; delete m.soon; } }));
  const ART = window.ART || {};
  const GLOSSARY = window.GLOSSARY || [];
  const PASS = 60;
  const LS_KEY = 'academy-dasha-v1';
  const app = document.getElementById('app');

  /* ---------- Индексы ---------- */
  const lessonIndex = {}, testIndex = {};
  COURSES.forEach(c => c.modules.forEach((m, mi) => {
    (m.lessons || []).forEach((l, li) => { lessonIndex[l.id] = { c, m, mi, l, li }; });
    if (m.test) testIndex[m.id] = { c, m, mi };
  }));
  function items(c) {
    const out = [];
    c.modules.forEach((m, mi) => {
      if (!m.lessons) return;
      m.lessons.forEach((l, li) => out.push({ type: 'l', id: l.id, href: '#l-' + l.id, title: l.title, m, mi, l, li }));
      if (m.test) out.push({ type: 't', id: m.id, href: '#t-' + m.id, title: 'Тест модуля «' + m.title + '»', m, mi });
    });
    return out;
  }

  /* ---------- Состояние ---------- */
  let S = { lessons: {}, tests: {}, last: null };
  try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) { /* хранилище недоступно */ }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }

  function passed(it) { return it.type === 'l' ? !!(S.lessons[it.id] && S.lessons[it.id].passed) : !!(S.tests[it.id] && S.tests[it.id].passed); }
  function unlocked(list, i) { return i === 0 || passed(list[i - 1]); }
  function courseProgress(c) { const list = items(c); const done = list.filter(passed).length; return { done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0, list }; }
  function nextItem(c) { const list = items(c); for (let i = 0; i < list.length; i++) if (!passed(list[i])) return unlocked(list, i) ? list[i] : null; return null; }

  /* ---------- Синхронизация через облако Telegram ---------- */
  const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
  const cloud = tg && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast('6.9') && tg.CloudStorage ? tg.CloudStorage : null;
  let synced = {}, writeTimer = null, cloudReady = false;
  function setSync(mode) {
    const el = document.getElementById('sync');
    if (mode === 'cloud') { el.className = 'sync cloud'; el.innerHTML = '<i></i><span>синхронизировано</span>'; el.title = 'Прогресс хранится в твоём аккаунте Telegram и доступен на всех устройствах'; }
    else { el.className = 'sync'; el.innerHTML = '<i></i><span>на этом устройстве</span>'; el.title = 'Прогресс сохраняется только в этом браузере'; }
  }
  function mergeEntry(a, b) {
    if (!a) return b; if (!b) return a;
    const newer = (b.at || 0) > (a.at || 0) ? b : a;
    return Object.assign({}, newer, { best: Math.max(a.best || 0, b.best || 0), passed: !!(a.passed || b.passed) });
  }
  // Каждый урок и тест — отдельный ключ (лимит значения в облаке Telegram — 4096 символов)
  function toKV(state) {
    const kv = {};
    Object.keys(state.lessons || {}).forEach(id => { kv['l_' + id] = JSON.stringify(state.lessons[id]); });
    Object.keys(state.tests || {}).forEach(id => { kv['t_' + id] = JSON.stringify(state.tests[id]); });
    if (state.last) kv['last'] = JSON.stringify(state.last);
    return kv;
  }
  function fromKV(kv) {
    const st = { lessons: {}, tests: {}, last: null };
    Object.keys(kv || {}).forEach(k => {
      let v; try { v = JSON.parse(kv[k]); } catch (e) { return; }
      if (!v) return;
      if (k.startsWith('l_')) st.lessons[k.slice(2)] = v;
      else if (k.startsWith('t_')) st.tests[k.slice(2)] = v;
      else if (k === 'last') st.last = v;
    });
    return st;
  }
  function merge(remote) {
    const before = JSON.stringify(S);
    ['lessons', 'tests'].forEach(k => {
      const r = (remote && remote[k]) || {};
      Object.keys(r).forEach(id => { S[k][id] = mergeEntry(S[k][id], r[id]); });
    });
    if (remote && remote.last && (!S.last || (remote.last.at || 0) > (S.last.at || 0))) S.last = remote.last;
    return JSON.stringify(S) !== before;
  }
  function persist() {
    saveLocal();
    if (!cloud || !cloudReady) return;
    clearTimeout(writeTimer);
    writeTimer = setTimeout(flush, 800);
  }
  function flush() {
    const kv = toKV(S);
    Object.keys(kv).forEach(k => {
      if (synced[k] === kv[k]) return;
      const val = kv[k];
      try { cloud.setItem(k, val, (err, ok) => { if (!err && ok) synced[k] = val; }); } catch (e) {}
    });
    const gone = Object.keys(synced).filter(k => !(k in kv));
    if (gone.length) { try { cloud.removeItems(gone, () => {}); } catch (e) {} gone.forEach(k => delete synced[k]); }
  }
  function cloudGetAll() {
    return new Promise(resolve => {
      try {
        cloud.getKeys((err, keys) => {
          if (err || !keys || !keys.length) return resolve({});
          const out = {}; let left = 0;
          const chunks = []; for (let i = 0; i < keys.length; i += 50) chunks.push(keys.slice(i, i + 50));
          left = chunks.length;
          chunks.forEach(ch => cloud.getItems(ch, (e, vals) => { if (!e && vals) Object.assign(out, vals); if (--left === 0) resolve(out); }));
        });
      } catch (e) { resolve({}); }
    });
  }
  async function initRemote() {
    if (!cloud) { setSync('local'); return; }
    const remoteKV = await cloudGetAll();
    synced = Object.assign({}, remoteKV);
    const changed = merge(fromKV(remoteKV));
    cloudReady = true;
    setSync('cloud');
    if (changed) { saveLocal(); const ae = document.activeElement; if (!(ae && ae.tagName === 'TEXTAREA')) render(false); }
    flush();
  }

  /* ---------- Telegram: тема, кнопка «Назад», вибрация ---------- */
  function applyTgTheme() { if (tg) document.documentElement.setAttribute('data-theme', tg.colorScheme === 'dark' ? 'dark' : 'light'); }
  function haptic(ok) { try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(ok ? 'success' : 'error'); } catch (e) {} }
  function parentHash() {
    const h = (location.hash || '#home').slice(1);
    if (h.startsWith('l-')) { const x = lessonIndex[h.slice(2)]; return x ? '#c-' + x.c.id : '#home'; }
    if (h.startsWith('t-')) { const x = testIndex[h.slice(2)]; return x ? '#c-' + x.c.id : '#home'; }
    return '#home';
  }
  function updateBack() {
    if (!tg || !tg.BackButton) return;
    const h = (location.hash || '#home').slice(1);
    if (h === 'home' || h === '') tg.BackButton.hide(); else tg.BackButton.show();
  }
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    applyTgTheme();
    try { tg.onEvent('themeChanged', applyTgTheme); } catch (e) {}
    try { tg.BackButton.onClick(() => { location.hash = parentHash(); }); } catch (e) {}
    try { tg.setHeaderColor && tg.setHeaderColor(tg.colorScheme === 'dark' ? '#151318' : '#F1F2EC'); } catch (e) {}
  }
  const userName = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name ? tg.initDataUnsafe.user.first_name : '';

  /* ---------- Утилиты ---------- */
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const pad = n => String(n).padStart(2, '0');
  const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); };
  function setColor(c) { document.body.className = c ? 'c-' + c.color : 'c-none'; }
  function art(name) { return ART[name] ? ART[name]() : ''; }
  function ring(pct, color) {
    const r = 50, C = 2 * Math.PI * r, off = C * (1 - pct / 100);
    return `<svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">${pct}%</text></svg>`;
  }

  /* ---------- Главная ---------- */
  function viewHome() {
    setColor(null);
    let lessonsDone = 0, lessonsTotal = 0, testsDone = 0, tasksDone = 0;
    COURSES.forEach(c => items(c).forEach(it => { if (it.type === 'l') { lessonsTotal++; if (passed(it)) lessonsDone++; if (S.lessons[it.id] && S.lessons[it.id].task) tasksDone++; } else if (passed(it)) testsDone++; }));
    const all = COURSES.map(courseProgress);
    const totalDone = all.reduce((a, p) => a + p.done, 0), totalAll = all.reduce((a, p) => a + p.total, 0);
    const pct = totalAll ? Math.round(totalDone / totalAll * 100) : 0;

    let cont = null;
    if (S.last && S.last.course) { const c = COURSES.find(x => x.id === S.last.course); if (c) { const n = nextItem(c); if (n) cont = { c, n }; } }
    if (!cont) for (const c of COURSES) { const n = nextItem(c); if (n) { cont = { c, n }; break; } }
    const started = totalDone > 0;

    app.innerHTML = `
    <section class="hero">
      <div class="hero-text">
        <div class="eyebrow">Твоя учебная платформа</div>
        <h1>Привет${userName ? `, <em>${esc(userName)}!</em>` : '!'}</h1>
        <p class="lead">Три курса, чтобы понимать своё тело: как еда превращается в энергию, как устроена кожа и почему движение делает тело подтянутым.</p>
        <div class="hero-actions">
          ${cont ? `<a class="btn c-${cont.c.color}" href="${cont.n.href}">${started ? 'Продолжить' : 'Начать'}: ${esc(cont.n.title)} →</a>` : ''}
        </div>
      </div>
      <div class="stat-card">
        <div class="ring-row">
          ${ring(pct, 'var(--plum)')}
          <div><div class="eyebrow">Общий прогресс</div><p class="muted" style="font-size:15px">Считается по открытым урокам и тестам. Новые модули будут добавляться.</p></div>
        </div>
        <div class="mini-stats">
          <div><b>${lessonsDone}/${lessonsTotal}</b><span>${plural(lessonsDone, 'урок', 'урока', 'уроков')} пройдено</span></div>
          <div><b>${testsDone}</b><span>${plural(testsDone, 'тест', 'теста', 'тестов')} модулей</span></div>
          <div><b>${tasksDone}</b><span>${plural(tasksDone, 'задание', 'задания', 'заданий')} сделано</span></div>
        </div>
        <div class="course-bars">
          ${COURSES.map((c, i) => `<div class="cb c-${c.color}"><span>${esc(c.title)}</span><div class="bar"><span style="width:${all[i].pct}%"></span></div><span>${all[i].pct}%</span></div>`).join('')}
        </div>
      </div>
    </section>

    <div class="section-title"><h2>Курсы</h2><span class="muted" style="font-size:14.5px">проходи в любом порядке</span></div>
    <section class="courses">
      ${COURSES.map((c, i) => {
        const ready = c.modules.filter(m => m.lessons).length;
        return `<a class="course-card c-${c.color}" href="#c-${c.id}">
          <div class="cover">${art(c.cover)}</div>
          <div class="cc-body">
            <div class="sub">${esc(c.subtitle)}</div>
            <h3>${esc(c.title)}</h3>
            <p>${esc(c.about)}</p>
            <div class="bar"><span style="width:${all[i].pct}%"></span></div>
            <div class="cc-meta"><span>${ready} из ${c.modules.length} модулей открыто</span><span>${all[i].pct}%</span></div>
          </div>
        </a>`;
      }).join('')}
    </section>

    <div class="section-title"><h2>Как проходить</h2></div>
    <section class="how">
      <div><b>1</b><h4>Читай урок</h4><p>10–15 минут. Схемы, примеры, мифы и правда.</p></div>
      <div><b>2</b><h4>Главное за 30 секунд</h4><p>Короткий итог, чтобы закрепить суть.</p></div>
      <div><b>3</b><h4>Практика</h4><p>Задание из жизни и место для твоих заметок.</p></div>
      <div><b>4</b><h4>Проверь себя</h4><p>60% правильных ответов открывают следующий урок.</p></div>
    </section>

    <footer class="foot">
      <span>Курсы дают понимание, но не заменяют врача. С симптомами и анализами иди к специалисту.</span>
      <button class="linkbtn" id="resetBtn">Сбросить прогресс</button>
    </footer>`;
    document.getElementById('resetBtn').onclick = confirmReset;
  }

  function confirmReset() {
    const bg = document.createElement('div');
    bg.className = 'dlg-bg';
    bg.innerHTML = `<div class="dlg c-none" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">Сбросить весь прогресс?</h3><p class="muted">Пройденные уроки, результаты тестов и заметки удалятся на всех твоих устройствах. Это нельзя отменить.</p><div class="actions"><button class="btn ghost small" id="dNo">Отмена</button><button class="btn danger small" id="dYes">Сбросить</button></div></div>`;
    document.body.appendChild(bg);
    const close = () => bg.remove();
    bg.addEventListener('click', e => { if (e.target === bg) close(); });
    bg.querySelector('#dNo').onclick = close;
    bg.querySelector('#dYes').onclick = () => { S = { lessons: {}, tests: {}, last: null }; persist(); close(); render(); };
    bg.querySelector('#dNo').focus();
  }

  /* ---------- Курс ---------- */
  function viewCourse(c) {
    setColor(c);
    const p = courseProgress(c), list = p.list, n = nextItem(c);
    const ready = c.modules.filter(m => m.lessons);
    const lessonCount = ready.reduce((a, m) => a + m.lessons.length, 0);
    const soonCount = c.modules.reduce((a, m) => a + (m.soon ? m.soon.length : 0), 0);

    app.innerHTML = `
    <a class="back" href="#home">← Все курсы</a>
    <section class="c-hero">
      <div class="c-hero-text">
        <div class="eyebrow">${esc(c.subtitle)}</div>
        <h1>${esc(c.title)}</h1>
        <p>${esc(c.about)}</p>
        <div class="c-stats"><span><b>${c.modules.length}</b> модулей в программе</span><span><b>${lessonCount}</b> ${plural(lessonCount, 'урок', 'урока', 'уроков')} открыто</span><span><b>${soonCount}</b> в работе</span></div>
        <div class="bar"><span style="width:${p.pct}%"></span></div>
        <div>${n ? `<a class="btn" href="${n.href}">${p.done ? 'Продолжить' : 'Начать курс'} →</a>` : (p.total ? '<span class="pill done">Все открытые уроки пройдены</span>' : '')}</div>
      </div>
      <div class="cover">${art(c.cover)}</div>
    </section>
    <section class="modules">
      ${c.modules.map((m, mi) => {
        if (!m.lessons) return `<article class="module soon"><div class="m-num">${pad(mi + 1)}</div><div class="m-head"><h3>${esc(m.title)}</h3><span class="pill">Скоро</span></div><p class="m-desc">${esc(m.desc)}</p><div class="soon-list">${m.soon.map(s => `<span>${esc(s)}</span>`).join('')}</div></article>`;
        const mItems = list.filter(it => it.m === m);
        const mDone = mItems.filter(passed).length;
        const status = mDone === mItems.length ? '<span class="pill done">Пройден</span>' : (mDone ? `<span class="pill go">${mDone} из ${mItems.length}</span>` : '');
        return `<article class="module"><div class="m-num">${pad(mi + 1)}</div><div class="m-head"><h3>${esc(m.title)}</h3>${status}</div><p class="m-desc">${esc(m.desc)}</p>
          <div class="lessons">${mItems.map(it => {
            const idx = list.indexOf(it), done = passed(it), open = unlocked(list, idx);
            const cls = done ? 'done' : (open ? 'next' : 'locked');
            const isT = it.type === 't';
            const best = isT ? S.tests[it.id] : S.lessons[it.id];
            const meta = done ? `${best.best}%` : (open ? (isT ? `${m.test.length} вопросов` : `${it.l.time} мин`) : 'закрыт');
            const inner = `<span class="st">${done ? '✓' : (open ? (isT ? '★' : it.li + 1) : '<svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><rect x="1" y="6" width="10" height="7" rx="2" fill="currentColor"/><path d="M3.5 6V4.5a2.5 2.5 0 0 1 5 0V6" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>')}</span><span class="lt">${isT ? 'Тест модуля' : esc(it.title)}</span><span class="lm">${meta}</span>`;
            return open ? `<a class="lrow ${cls}${isT ? ' test' : ''}" href="${it.href}">${inner}</a>` : `<div class="lrow ${cls}${isT ? ' test' : ''}" aria-disabled="true">${inner}</div>`;
          }).join('')}
          ${m.soon ? m.soon.map(s => `<div class="lrow soonl"><span class="st">·</span><span class="lt">${esc(s)}</span><span class="lm">скоро</span></div>`).join('') : ''}
          </div></article>`;
      }).join('')}
    </section>`;
  }

  /* ---------- Блоки урока ---------- */
  function block(b) {
    if (b.p) return `<p>${b.p}</p>`;
    if (b.h) return `<h2>${esc(b.h)}</h2>`;
    if (b.key) return `<aside class="callout key"><div class="callout-label">Ключевая мысль</div><p>${b.key}</p></aside>`;
    if (b.fact) return `<aside class="callout fact"><div class="callout-label">Любопытный факт</div><p>${b.fact}</p></aside>`;
    if (b.myth) return `<div class="myth"><div class="m"><span class="tag">Миф</span><p>${esc(b.myth)}</p></div><div class="t"><span class="tag">На самом деле</span><p>${esc(b.truth)}</p></div></div>`;
    if (b.art) return `<figure class="art"><div class="art-scroll">${art(b.art)}</div>${b.cap ? `<figcaption>${esc(b.cap)}</figcaption>` : ''}</figure>`;
    if (b.cards) return `<div class="cards">${b.cards.map(x => `<div class="card"><h4>${esc(x.t)}</h4><p>${esc(x.d)}</p></div>`).join('')}</div>`;
    if (b.steps) return `<ol class="steps">${b.steps.map(x => `<li><div><b>${esc(x.t)}</b><p>${esc(x.d)}</p></div></li>`).join('')}</ol>`;
    if (b.list) return `<ul class="list">${b.list.map(x => `<li>${x}</li>`).join('')}</ul>`;
    if (b.compare) return `<div class="compare">${[b.compare.a, b.compare.b].map(s => `<div><h4>${esc(s.t)}</h4><ul>${s.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div>`;
    if (b.table) return `<div class="table-wrap"><table><thead><tr>${b.table.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.table.rows.map(r => `<tr>${r.map(cl => `<td>${esc(cl)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    return '';
  }

  /* ---------- Тест ---------- */
  const RIGHT = ['Верно!', 'Точно!', 'Именно так!', 'В яблочко!', 'Правильно!'];
  const WRONG = ['Не совсем.', 'Почти, но нет.', 'Здесь ловушка.', 'Давай разберём.'];
  function shuffleQs(src) {
    return src.map(q => {
      const idx = q.o.map((_, i) => i);
      for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      return { q: q.q, o: idx.map(i => q.o[i]), a: idx.indexOf(q.a), e: q.e };
    });
  }
  function mountQuiz(el, source, kind, id, after) {
    let questions = shuffleQs(source);
    let st = { i: 0, picked: null, score: 0, marks: [] };
    function draw() {
      if (st.i >= questions.length) return drawResult();
      const q = questions[st.i], ans = st.picked !== null;
      el.innerHTML = `
        <div class="quiz-top"><h2>${kind === 't' ? 'Тест модуля' : 'Проверь себя'}</h2><div class="dots" aria-label="Вопрос ${st.i + 1} из ${questions.length}">${questions.map((_, k) => `<i class="${k < st.i ? (st.marks[k] ? 'ok' : 'no') : (k === st.i ? (ans ? (st.picked === q.a ? 'ok' : 'no') : 'cur') : '')}"></i>`).join('')}</div></div>
        <div class="muted" style="font-size:14px">Вопрос ${st.i + 1} из ${questions.length}</div>
        <div class="q-text">${esc(q.q)}</div>
        <div class="opts">${q.o.map((o, k) => {
          let cls = '';
          if (ans) { if (k === q.a) cls = 'right'; else if (k === st.picked) cls = 'wrong'; }
          return `<button class="opt ${cls}" data-k="${k}" ${ans ? 'disabled' : ''}><span class="letter">${'АБВГД'[k]}</span><span>${esc(o)}</span></button>`;
        }).join('')}</div>
        ${ans ? `<div class="explain ${st.picked === q.a ? 'ok' : 'no'}"><b>${(st.picked === q.a ? RIGHT : WRONG)[st.i % (st.picked === q.a ? RIGHT.length : WRONG.length)]}</b><span>${esc(q.e)}</span></div>
        <div><button class="btn" id="qNext">${st.i + 1 < questions.length ? 'Следующий вопрос →' : 'Посмотреть результат'}</button></div>` : ''}`;
      el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        st.picked = +b.dataset.k;
        const ok = st.picked === q.a; st.marks[st.i] = ok; if (ok) st.score++; haptic(ok);
        draw();
        const nb = el.querySelector('#qNext'); if (nb) nb.focus({ preventScroll: true });
      });
      const nb = el.querySelector('#qNext');
      if (nb) nb.onclick = () => { st.i++; st.picked = null; draw(); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    }
    function drawResult() {
      const pct = Math.round(st.score / questions.length * 100), ok = pct >= PASS;
      const bucket = kind === 't' ? S.tests : S.lessons;
      const prev = bucket[id] || {};
      bucket[id] = Object.assign({}, prev, { best: Math.max(prev.best || 0, pct), passed: !!(prev.passed || ok), at: Date.now() });
      S.last = { course: (kind === 't' ? testIndex[id] : lessonIndex[id]).c.id, at: Date.now() };
      persist();
      const nxt = after();
      const msg = ok
        ? (pct === 100 ? 'Идеально! Ты отлично усвоила материал.' : 'Отличный результат. ' + (kind === 't' ? 'Модуль пройден, следующий открыт.' : 'Следующий урок открыт.'))
        : `Чтобы открыть ${kind === 't' ? 'следующий модуль' : 'следующий урок'}, нужно ${PASS}%. Перечитай «Главное» и попробуй ещё раз, вопросы те же.`;
      el.innerHTML = `<div class="result">
        ${ok ? '<div class="burst" aria-hidden="true">' + Array.from({ length: 22 }, (_, k) => { const a = k / 22 * Math.PI * 2, d = 90 + (k % 4) * 30; const col = ['var(--nut)', 'var(--skin)', 'var(--body)', 'var(--plum)'][k % 4]; return `<i style="--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d * .7).toFixed(0)}px;background:${col};animation-delay:${(k % 5) * 30}ms"></i>`; }).join('') + '</div>' : ''}
        <div class="eyebrow">${ok ? 'Пройдено' : 'Почти получилось'}</div>
        <div class="big">${st.score} из ${questions.length}</div>
        <p>${msg}</p>
        <div class="actions">
          ${ok && nxt ? `<a class="btn" href="${nxt.href}">Дальше: ${esc(nxt.title)} →</a>` : ''}
          ${ok && !nxt ? `<a class="btn" href="#c-${(kind === 't' ? testIndex[id] : lessonIndex[id]).c.id}">К программе курса →</a>` : ''}
          <button class="btn ghost" id="qAgain">Пройти ещё раз</button>
        </div></div>`;
      el.querySelector('#qAgain').onclick = () => { questions = shuffleQs(source); st = { i: 0, picked: null, score: 0, marks: [] }; draw(); };
    }
    draw();
  }

  /* ---------- Урок ---------- */
  function lockedView(c, list, idx) {
    let need = null; for (let i = idx - 1; i >= 0; i--) if (!passed(list[i])) need = list[i];
    app.innerHTML = `<div class="locked-box"><div class="eyebrow">Пока закрыто</div><h1>Сначала пройди предыдущие шаги</h1><p class="muted">Уроки открываются по порядку: так знания ложатся друг на друга.</p>${need ? `<a class="btn" href="${need.href}">Перейти: ${esc(need.title)} →</a>` : ''}<a class="back" href="#c-${c.id}" style="margin:0">← К программе курса</a></div>`;
  }

  function viewLesson(id) {
    const x = lessonIndex[id]; if (!x) return viewHome();
    const { c, m, mi, l, li } = x;
    setColor(c);
    const list = items(c), idx = list.findIndex(it => it.type === 'l' && it.id === id);
    if (!unlocked(list, idx)) return lockedView(c, list, idx);
    const rec = S.lessons[id] || {};
    const prev = list[idx - 1], next = list[idx + 1];
    app.innerHTML = `
    <article class="lesson">
      <a class="back" href="#c-${c.id}">← ${esc(c.title)} · модуль ${mi + 1}</a>
      <header class="l-head">
        <div class="eyebrow">Модуль ${mi + 1} · Урок ${li + 1} · ≈ ${l.time} мин</div>
        <h1>${esc(l.title)}</h1>
        <p class="l-lead">${esc(l.lead)}</p>
      </header>
      <div class="content">${l.blocks.map(block).join('')}</div>
      <section class="summary"><h2>Главное за 30 секунд</h2><ul>${l.summary.map(s => `<li><span>${esc(s)}</span></li>`).join('')}</ul></section>
      <section class="task">
        <div class="eyebrow">Практическое задание</div>
        <h3>${esc(l.task.title)}</h3>
        <p>${esc(l.task.text)}</p>
        <label class="check"><input type="checkbox" id="taskDone" ${rec.task ? 'checked' : ''}> Задание выполнено</label>
        <label for="notes" class="muted" style="font-size:14px">Мои заметки</label>
        <textarea class="notes" id="notes" maxlength="3000" placeholder="Записывай сюда выводы, ответы и вопросы">${esc(rec.note || '')}</textarea>
        <div class="saved-note" id="savedNote" aria-live="polite"></div>
      </section>
      <section class="quiz" id="quiz"></section>
      <nav class="l-nav">
        ${prev ? `<a class="btn ghost small" href="${prev.href}">← Назад</a>` : '<span></span>'}
        ${next && rec.passed ? `<a class="btn small" href="${next.href}">${next.type === 't' ? 'К тесту модуля' : 'Следующий урок'} →</a>` : ''}
      </nav>
    </article>`;
    const upd = patch => { S.lessons[id] = Object.assign({}, S.lessons[id] || {}, patch, { at: Date.now() }); persist(); };
    document.getElementById('taskDone').onchange = e => upd({ task: e.target.checked });
    const notes = document.getElementById('notes'), sn = document.getElementById('savedNote');
    let nt = null;
    notes.oninput = () => { sn.textContent = ''; clearTimeout(nt); nt = setTimeout(() => { upd({ note: notes.value }); sn.textContent = 'Сохранено'; }, 700); };
    mountQuiz(document.getElementById('quiz'), l.quiz, 'l', id, () => list[idx + 1] || null);
  }

  function viewTest(mid) {
    const x = testIndex[mid]; if (!x) return viewHome();
    const { c, m, mi } = x;
    setColor(c);
    const list = items(c), idx = list.findIndex(it => it.type === 't' && it.id === mid);
    if (!unlocked(list, idx)) return lockedView(c, list, idx);
    const rec = S.tests[mid] || {};
    app.innerHTML = `
    <article class="lesson">
      <a class="back" href="#c-${c.id}">← ${esc(c.title)} · модуль ${mi + 1}</a>
      <header class="l-head">
        <div class="eyebrow">Модуль ${mi + 1} · Итоговый тест</div>
        <h1>${esc(m.title)}</h1>
        <p class="l-lead">${m.test.length} вопросов по всему модулю, некоторые на применение знаний в жизни. Нужно ${PASS}%, чтобы открыть следующий модуль.${rec.best ? ` Твой лучший результат: ${rec.best}%.` : ''}</p>
      </header>
      <section class="quiz" id="quiz" style="margin-top:0"></section>
    </article>`;
    mountQuiz(document.getElementById('quiz'), m.test, 't', mid, () => list[idx + 1] || null);
  }

  /* ---------- Словарь ---------- */
  function viewGlossary() {
    setColor(null);
    app.innerHTML = `
    <header class="gl-head"><div class="eyebrow">Словарь</div><h1>Термины курсов</h1><p class="muted">Быстро вспомнить, что значит слово, и вернуться к уроку, где оно объясняется.</p>
    <input class="search" id="q" type="search" placeholder="Найти термин" aria-label="Найти термин"></header>
    <section class="gl" id="gl"></section>`;
    const gl = document.getElementById('gl'), q = document.getElementById('q');
    function draw() {
      const s = q.value.trim().toLowerCase();
      const rows = GLOSSARY.filter(([t, d]) => !s || t.toLowerCase().includes(s) || d.toLowerCase().includes(s)).sort((a, b) => a[0].localeCompare(b[0], 'ru'));
      gl.innerHTML = rows.length ? rows.map(([t, d, lid]) => {
        const li = lessonIndex[lid];
        let link = '';
        if (li) { const list = items(li.c), i = list.findIndex(it => it.id === lid); link = unlocked(list, i) ? `<a class="c-${li.c.color}" href="#l-${lid}">Урок: ${esc(li.l.title)} →</a>` : `<span class="muted" style="font-size:13.5px">Урок «${esc(li.l.title)}» пока закрыт</span>`; }
        return `<div class="term"><h3>${esc(t)}</h3><p>${esc(d)}</p>${link}</div>`;
      }).join('') : '<p class="muted">Ничего не нашлось. Попробуй другое слово.</p>';
    }
    q.oninput = draw; draw();
  }

  /* ---------- Роутинг ---------- */
  function render(scroll = true) {
    const h = (location.hash || '#home').slice(1);
    document.getElementById('navHome').classList.toggle('on', h === 'home' || h.startsWith('c-'));
    document.getElementById('navGl').classList.toggle('on', h === 'glossary');
    if (h.startsWith('c-')) { const c = COURSES.find(x => x.id === h.slice(2)); c ? viewCourse(c) : viewHome(); }
    else if (h.startsWith('l-')) viewLesson(h.slice(2));
    else if (h.startsWith('t-')) viewTest(h.slice(2));
    else if (h === 'glossary') viewGlossary();
    else viewHome();
    if (scroll) window.scrollTo(0, 0);
    updateBack();
    onScroll();
  }
  function onScroll() {
    const bar = document.getElementById('readBar');
    const h = location.hash;
    if (!(h.startsWith('#l-'))) { bar.style.width = '0'; return; }
    const max = document.documentElement.scrollHeight - innerHeight;
    bar.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + '%';
  }
  addEventListener('hashchange', () => render(true));
  addEventListener('scroll', onScroll, { passive: true });
  render(true);
  initRemote();
})();
</script>
</body>
</html>
